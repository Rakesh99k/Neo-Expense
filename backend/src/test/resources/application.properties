# Test database — H2 in memory, no env vars needed
spring.datasource.url=jdbc:h2:mem:expense_tracker_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schema management for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT — plain text 40+ chars, no env var needed for tests
jwt.secret=test-secret-key-minimum-32-bytes-long-ok

# CORS — not relevant for tests
allowed.origins=http://localhost:5173

# Disable actuator complexity in tests
management.endpoints.web.exposure.include=health