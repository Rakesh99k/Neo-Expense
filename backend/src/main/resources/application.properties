# ── Server ──────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Database ─────────────────────────────────────────────────
# All values come from environment variables
# Never hardcode credentials here
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# ── JPA ──────────────────────────────────────────────────────
# validate = Hibernate checks schema but does NOT change it
# Use 'update' only in dev, 'validate' in prod
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ── Jackson ───────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false

# ── JWT ───────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}

# ── CORS ──────────────────────────────────────────────────────
allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173}

# ── Actuator (health check for Render) ────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ── App ───────────────────────────────────────────────────────
spring.application.name=neoexpense-backend